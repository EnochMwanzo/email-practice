<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
    <meta name="x-apple-disable-message-reformatting">
    <meta name="color-scheme" content="light dark">
    <meta name="supported-color-schemes" content="light dark">
    <title>Email title</title>
    <style>
      @font-face {
        font-family: 'Ovo';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/ovo/v18/yYLl0h7WyfzTzI44.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      @font-face {
        font-family: 'Work Sans';
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/worksans/v24/QGYqz_wNahGAdqQ43Rh_eZDrv_0.woff2) format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      .cta:hover {
        font-size: 1.1em!important;
        background: #cb886fd5!important;

      }
      @media screen and (min-width: 600px) {        
        .wrapper {
          max-width: 600px!important;
          width: 96%!important;
        }
        
        .columns {
          display: table!important;
        }

        .column {
          display: table-cell!important;
          width: 50%!important;
        }
      }

      @media (prefers-color-scheme: dark) {
        .wrapper {
          background: #cb886f!important;
          color: #f1e6dd!important;
        }

        .columns {
          background: #cb886f!important; 
          color:#eee!important;
        }

        .cta {
          background: #f1e6dd!important;
          color: #cb886f!important;
        }

        .cta:hover {
          background: #f1e6ddd2!important;
        }

        h3 {
          color: #f1e6dd;
        }

      }
    </style>
  </head>
  <body class="body">
    <div role="article" aria-label="email name" lang="en" dir="ltr" style="font-size:medium; font-size:max(16px, 1rem)">
      <div style="display:none">
        Preview text...
      </div>
      <div style="background:#111">
        <div class="wrapper" style="max-width:360px; margin:0 auto;background:#f1e6dd; color: #cb886f; text-align: center; align-items: center;">
          <div>
            <div class="spacer" style="line-height:0.7em;height:0.7em;">&nbsp;</div>
            <h1 style="font-family: Ovo, 'Work Sans'; font-size: 2em;">
              BORCELLE
            </h1>
          </div>
          <div role="presentation" style="display:table; width: 100%; background-image: url(https://images.pexels.com/photos/458766/pexels-photo-458766.jpeg); background-size: 100% auto; background-repeat: no-repeat;">
            <h1 style="font-family: Ovo, 'Work Sans'; font-size: 3em; color: #eee;">Glow your skin</h1>
            <h1 style="font-family: cursive, 'Work Sans'; font-size: 3em; color: #eee;">naturally</h1>
          </div>
          <div class="columns" style="width: 100%; background: #eee; color:#cb886f">
            <div class="column">
              <img src="https://images.pexels.com/photos/301367/pexels-photo-301367.jpeg" style="display: block; width: 100%; height:auto" alt="makeup products">
            </div>
            <div class="column" style="vertical-align: middle;">
              <h2 style="font-family: Ovo, 'Work Sans'; font-size: 1.75em; margin: 0 auto;">Our Products</h2>
              <p style="font-family: 'Work Sans', sans-serif;">
                Lorem ipsum dolor sit amet, consectetur adipiscing elit. In ac cursus urna, auctor ullamcorper mauris. Praesent tortor libero, ullamcorper id fringilla vitae..
              </p>
              <div style="padding: 1em 0;">
                <a class="cta" href="#" style="display: inline-block; text-decoration: none; background-color: #cb886f; color: #eee; font-family: 'Work Sans', sans-serif; font-size: 1em; padding: 1em;">
                  ORDER NOW
                </a>
              </div>
            </div>
          </div>
          <div>
            <a href="#" style="text-decoration: none; color: #cb886f;">
              <h3 style="font-family: 'Work Sans', sans-serif; font-size: 16px; padding: 1em;">WWW.REALLYGREATSITE.COM</h3>
            </a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
